<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Smart Level - 스마트 수평계</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f8;color:#18202a;transition:background .15s}
body.alert{background:#ff4b4b}
.app{max-width:560px;margin:auto;padding:22px 16px 32px}
h1{margin:0;font-size:28px}.sub{margin:6px 0 18px;color:#66717e}
.card{background:#fff;border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 5px 20px rgba(0,0,0,.07)}
.level{height:310px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:18px;background:#eef1f4}
.circle{width:235px;height:235px;border:3px solid #27313b;border-radius:50%;position:relative}
.bubble{width:42px;height:42px;border-radius:50%;background:#222;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);transition:transform .08s linear}
.cross:before,.cross:after{content:"";position:absolute;background:#27313b}
.cross:before{width:2px;height:100%;left:50%;top:0}.cross:after{height:2px;width:100%;top:50%;left:0}
.degree{font-size:38px;font-weight:800;text-align:center;margin-top:15px}.state{text-align:center;font-weight:800;margin-top:4px;font-size:18px}
.good{color:#14804a}.warn{color:#b26a00}.bad{color:#c53b3b}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f4f6f8;border-radius:14px;padding:13px}.metric b{display:block;font-size:21px;margin-top:3px}
button{border:0;border-radius:13px;padding:13px 16px;font-size:15px;font-weight:700;background:#202831;color:white;width:100%;cursor:pointer}
button.secondary{background:#e8edf1;color:#202831;margin-top:9px}
label{font-size:14px;color:#66717e}.targetrow{display:flex;gap:9px;margin-top:7px}.targetrow input{flex:1;border:1px solid #d5dbe1;border-radius:12px;padding:12px;font-size:16px}
.note{font-size:12px;color:#78828d;line-height:1.5}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#e9edf1;font-size:12px;font-weight:700}
#live{font-size:13px;color:#66717e;text-align:center;margin-top:8px}
</style>
</head>
<body>
<div class="app">
<h1>📐 Smart Level</h1>
<div class="sub">스마트폰 센서로 실시간 기울기를 측정하는 웹 수평계</div>

<div class="card">
<div class="level"><div class="circle cross"><div id="bubble" class="bubble"></div></div></div>
<div id="degree" class="degree">0.0°</div>
<div id="state" class="state warn">센서 시작 전</div>
<div id="live">실시간 측정 대기 중</div>
</div>

<div class="card"><div class="grid">
<div class="metric">좌우 기울기 (X)<b id="x">0.0°</b></div>
<div class="metric">앞뒤 기울기 (Y)<b id="y">0.0°</b></div>
</div></div>

<div class="card">
<span class="badge">알림 기준</span>
<p class="note">수평(0°) 또는 90°에 가까워지면 짧은 진동과 함께 화면이 빨간색으로 표시됩니다.</p>
</div>

<div class="card">
<button id="startBtn" type="button">📱 센서 시작</button>
<button id="calBtn" class="secondary" type="button">🎯 현재 상태를 0°로 보정</button>
<p class="note">※ 진동은 기기와 브라우저가 지원하는 경우 작동합니다. HTTPS 사이트에서 실행하는 것을 권장합니다.</p>
</div>
</div>

<script>
let rawX=0,rawY=0,offsetX=0,offsetY=0,started=false,lastAlert=0,lastZone="";
const $=id=>document.getElementById(id);
function smooth(a,b){return a*.82+b*.18}
function vib(){if(navigator.vibrate) navigator.vibrate([90]);}
function alertScreen(zone){
 const now=Date.now();
 if(zone!==lastZone || now-lastAlert>1400){vib();lastAlert=now;}
 lastZone=zone;
 document.body.classList.toggle("alert",!!zone);
}
function update(x,y){
 rawX=smooth(rawX,x-offsetX); rawY=smooth(rawY,y-offsetY);
 const total=Math.sqrt(rawX*rawX+rawY*rawY);
 $("x").textContent=rawX.toFixed(1)+"°";
 $("y").textContent=rawY.toFixed(1)+"°";
 $("degree").textContent=total.toFixed(1)+"°";
 const px=Math.max(-82,Math.min(82,rawX*5)),py=Math.max(-82,Math.min(82,rawY*5));
 $("bubble").style.transform=`translate(calc(-50% + ${px}px),calc(-50% + ${py}px))`;

 // "수평"은 전체 기울기 1도 이내, 90도는 전체 기울기 89~90도 부근을 알림.
 let zone="";
 if(total<=1.0) zone="level";
 else if(Math.abs(total-90)<=1.0) zone="90";
 alertScreen(zone);

 if(zone==="level"){ $("state").textContent="✓ 수평입니다";$("state").className="state good";$("live").textContent="0° 기준 수평 상태"}
 else if(zone==="90"){ $("state").textContent="✓ 90°입니다";$("state").className="state good";$("live").textContent="90° 기준 수직 상태"}
 else if(total<=4){ $("state").textContent="거의 수평입니다";$("state").className="state warn";$("live").textContent="수평까지 "+total.toFixed(1)+"°"}
 else if(total<86){ $("state").textContent="기울기를 조정하세요";$("state").className="state bad";$("live").textContent="현재 기울기 "+total.toFixed(1)+"°"}
 else { $("state").textContent="90°에 가까워지고 있습니다";$("state").className="state warn";$("live").textContent="90°까지 "+Math.abs(90-total).toFixed(1)+"°"}
}
function handleOrientation(e){
 let x=Number(e.gamma||0), y=Number(e.beta||0);
 if(Math.abs(y)>90)y=y>0?180-y:-180-y;
 update(x,y);
}
async function startSensor(){
 try{
  if(typeof DeviceOrientationEvent==="undefined"){alert("이 브라우저에서는 방향 센서를 사용할 수 없습니다.");return;}
  if(typeof DeviceOrientationEvent.requestPermission==="function"){
   const p=await DeviceOrientationEvent.requestPermission();
   if(p!=="granted"){alert("센서 권한이 허용되지 않았습니다.");return;}
  }
  window.addEventListener("deviceorientation",handleOrientation,true);
  started=true;$("startBtn").textContent="✓ 실시간 센서 측정 중";$("live").textContent="센서 데이터 수신 중";
 }catch(e){alert("센서를 시작할 수 없습니다: "+e.message);}
}
function calibrate(){offsetX=rawX;offsetY=rawY;rawX=0;rawY=0;update(0,0);}
$("startBtn").addEventListener("click",startSensor);
$("calBtn").addEventListener("click",calibrate);
</script>
</body></html>
